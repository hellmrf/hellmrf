name: Build Latest

on:
  push:
    branches:
      - main
    paths:
      - PDF/**

jobs:
  build:
    name: Compilar LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          texlive_version: 2025
          run: |
            echo "-----------\n"
            echo "> which arara\n"
            which arara
            echo "\n\n> arara -d PDF -v main.tex\n"
            arara -d PDF -v main.tex
            echo "\n\n> arara -d PDF -v en.tex\n"
            arara -d PDF -v en.tex
            cp PDF/main.pdf Heliton-CV-pt.pdf
            cp PDF/en.pdf Heliton-CV-en.pdf

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DATE_STR="$(date -u +'%Y-%m-%d')"
          TAG_NAME="${DATE_STR}-${GITHUB_SHA::7}"

          gh release create "${TAG_NAME}" \
            --title "${DATE_STR}" \
            --notes "Build automático do commit ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}" \
            --latest \
            Heliton-CV-pt.pdf \
            Heliton-CV-en.pdf
